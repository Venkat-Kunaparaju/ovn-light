apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ovn-light-traffic-jobs, namespace: ovn-k8s-flow-tests}
rules:
- apiGroups: [batch]
  resources: [cronjobs]
  resourceNames: [ovn-sdn-flow-tests]
  verbs: [get]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get, list, delete]
- apiGroups: [""]
  resources: [pods, pods/log]
  verbs: [get, list]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [ovn-sdn-ft-config, ovn-sdn-ft-config-user]
  verbs: [get, delete]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ovn-light-traffic-jobs, namespace: ovn-k8s-flow-tests}
subjects:
- {kind: ServiceAccount, name: ovn-light, namespace: ovn-light}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ovn-light-traffic-jobs}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: ovn-light-traffic-test, namespace: ovn-light}
data:
  OVN_LIGHT_TRAFFIC_TEST_NAMESPACE: ovn-k8s-flow-tests
